    <script>
      // apply saved settings before first paint so nothing flashes. src/settings.ts owns the real logic
      try {
        var p = JSON.parse(localStorage.getItem('prefs') || '{}')
        var u = new URLSearchParams(location.search)
        var d = document.documentElement.dataset
        var t = u.get('theme') || p.theme || localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        d.theme = t
        d.view = u.get('view') || p.view || 'full'
        d.size = u.get('size') || p.size || 'm'
        d.accent = u.get('accent') || p.accent || 'blue'
      } catch (e) {}
    </script>
