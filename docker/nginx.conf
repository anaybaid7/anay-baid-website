# Serves the built static site. Kept deliberately small and commented since
# this file only needs to do four things well: compress responses, set
# sane caching (hashed assets forever, the service worker and HTML never),
# add basic security headers, and fall back to index.html for any path this
# single-page app doesn't have a physical file for.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
        application/manifest+json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints these filenames with a content hash, so a given
    # filename's contents never change: safe to cache for a year.
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker's own filename is fixed (not content-hashed), so a
    # cached copy would stop a visitor from ever getting the next
    # deployment's update logic. Always revalidate it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The HTML shell and manifest can change on every deploy without a
    # filename change, so never let a browser or proxy cache them.
    location ~* \.(?:html|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: any path without a matching file falls back to the
    # shell, which then renders the right tab from client-side state.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
